<!DOCTYPE html>
<html lang="en-US" class="h-100">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    .overlay-buttons {
      position: fixed;
      bottom: 2rem;
      right: 0.25rem;
      background-color: rgba(0, 0, 0, 0.75);
      padding: 1rem;
      border-radius: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 9999;
    }

    .overlay-buttons a {
      text-decoration: none;
    }

    .overlay-buttons button {
      width: 100%;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      background-color: #1e40af; /* blue-800 */
      transition: background-color 0.3s;
    }

    .overlay-buttons button:hover {
      background-color: #1d4ed8; /* blue-700 */
    }

    @media (max-width: 640px) {
      .overlay-buttons {
        right: 0.5rem;
        bottom: 0.5rem;
        padding: 0.75rem;
        gap: 0.4rem;
      }

      .overlay-buttons button {
        font-size: 0.9rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div id="minerva-browser" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%;"></div>

  <!-- Overlay Buttons with Links -->
  <div class="overlay-buttons">
    <a href="https://standardbio.showell.app/s/y7FJuqTVcALHBhjVTrdOj8Zw/2/view/6710002ae7ddca0b1e05f7c8/2" target="_blank" rel="noopener">
      <button>Dig deeper</button>
    </a>
    <a href='../index.html' target="_blank" rel="noopener">
      <button>More stories</button>
    </a>
  </div>

  <script defer src="https://use.fontawesome.com/releases/v5.2.0/js/all.js" integrity="sha384-4oV5EgaV02iISL2ban6c/RmotsABqE4yZxZLcYMAdG7FAPsyHYAPpywE9PJo+Khy" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/minerva-browser@3.19.6/build/bundle.js"></script>
<script>
      window.viewer = MinervaStory.default.build_page({
        hideWelcome: true,
        cellTypeData: [],
        markerData: [],
        exhibit: "exhibit.json",
        id: "minerva-browser",
        embedded: true
      });
  </script>
</body>

</html>
